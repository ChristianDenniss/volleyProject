name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: BE/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm test
        env:
          NODE_ENV: test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BACKEND_URL: http://localhost:3000