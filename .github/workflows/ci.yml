name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable from release.yml, so the release gate and the PR gate are the same
  # checks rather than two copies that can drift.
  workflow_call:

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: BE/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm test
        env:
          NODE_ENV: test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: FE/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BACKEND_URL: http://localhost:3000