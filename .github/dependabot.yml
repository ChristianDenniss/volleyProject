# Dependabot opens PRs only for known vulnerabilities, not routine version bumps.
# Version updates stay closed via open-pull-requests-limit: 0. Security updates
# still work when GitHub publishes an advisory (repo setting: Dependabot
# security updates). Multiple advisories in one ecosystem are grouped.
version: 2
updates:
  - package-ecosystem: npm
    directory: /FE
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - ci
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /BE
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - ci
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    labels:
      - ci
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
